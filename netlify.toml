# Netlify build configuration — keeps deploy settings version-controlled
# instead of only living in the Netlify UI.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires Node >= 20.19; pin so Netlify image changes can't break builds.
  NODE_VERSION = "22"

# Pretty URL for the blog entry (must come before the SPA catch-all).
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

# SPA fallback (public/_redirects does the same; this is the canonical copy).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Caching ---
# Vite fingerprints everything in /assets with a content hash, so it can be
# cached forever; a new build produces new filenames.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always revalidate so a new deploy is picked up immediately.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/id/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons, share image, manifest, sitemap, robots — non-hashed, cache a day.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
