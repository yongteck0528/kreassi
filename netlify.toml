# Netlify build configuration — keeps deploy settings version-controlled
# instead of only living in the Netlify UI.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  # Server-side code (analytics ingest, team, site rebuilds). Secrets come from Netlify environment variables.
  directory = "netlify/functions"

[build.environment]
  # Vite 7 requires Node >= 20.19; pin so Netlify image changes can't break builds.
  NODE_VERSION = "22"

# Blog: static pages built by scripts/build-blog.mjs (dist/blog/…). Existing
# pages are served as they are; these rules only apply when no file matches.
# Old post addresses are added to _redirects by the build. All of this must
# come before the SPA catch-all.
[[redirects]]
  from = "/blog.html"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/blog/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/blog/404.html"
  status = 404

# Admin app (client-side routes like /admin/posts). Must come before the SPA catch-all.
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# SPA fallback (public/_redirects does the same; this is the canonical copy).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Caching ---
# Vite fingerprints everything in /assets with a content hash, so it can be
# cached forever; a new build produces new filenames.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always revalidate so a new deploy is picked up immediately.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/id/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Icons, share image, manifest, sitemap, robots — non-hashed, cache a day.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- Admin area ---
# Never indexed, never framed by other sites, never cached (always the latest build).
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-store"
